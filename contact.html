  <section class="contact-section">
    <h2>Contact Me</h2>
    <p>I'd love to hear from you! Whether it's for a project, a question, or just to connect.</p>

    <form class="contact-form" action="mailto:omolemo@example.com" method="post" enctype="text/plain">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit" class="btn">Send Message</button>
    </form>

    <div class="contact-icons">
      <a href="https://linkedin.com/in/omolemo-ramodike" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://instagram.com/omolemo-ngobeni" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://github.com/omolemo-ngobeni" target="_blank"><i class="fab fa-github"></i></a>
    </div>
